[project]
name = "rl_model"
version = "0.1.0"
description = "Belief-state RL model of VR-corridor behaviour (StriatumACC project)"
requires-python = ">=3.11"

# Runtime dependencies.  Lower bounds are the versions the model was developed
# and tested against (see UNDERSTANDING.md); pin exactly via the uv lockfile.
# JAX runs on CPU here; install the appropriate jaxlib build for any GPU.
dependencies = [
    "jax>=0.10.1",
    "jaxlib>=0.10.1",
    "numpy>=2.4.0",
    "scipy>=1.17.0",
    "h5py>=3.16.0",
    "matplotlib>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rl_model"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
